<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">MLToolBench: learning to use diagnostic tools</title>
  <desc id="desc">Diagnostic tools supply evidence to an agent that revises code, verifies it, and iterates. Training combines SFT and reinforcement learning with SPICE. This is a conceptual summary, not an experimental plot.</desc>
  <!-- Source: https://arxiv.org/abs/2609.36679 -->
  <style>
    :root { --bg:#f5f8fc; --surface:#fff; --ink:#1a2942; --muted:#52657e; --line:#d7e1ef; --blue:#4361cc; --blue-soft:#e7edff; --teal:#168977; --teal-soft:#e1f3ef; --violet:#795abb; --violet-soft:#eee8f9; }
    @media (prefers-color-scheme:dark) { :root { --bg:#162233; --surface:#1c2d44; --ink:#edf3fc; --muted:#aec0d7; --line:#354c68; --blue:#a8bcff; --blue-soft:#273d67; --teal:#78d9c5; --teal-soft:#1c4546; --violet:#cab4fa; --violet-soft:#3e325a; } }
    text { font-family:Inter,Arial,sans-serif; fill:var(--ink); }
    .heading { font-size:34px; font-weight:700; letter-spacing:-1px; }
    .subtitle { font-size:20px; fill:var(--muted); }
    .label { font-size:23px; font-weight:600; text-anchor:middle; }
    .stroke { fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-width:3.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 2 8 5 2 8" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="600" height="360" fill="var(--bg)"/>
  <circle cx="542" cy="30" r="112" fill="var(--blue-soft)" opacity=".6"/>
  <text x="32" y="59" class="heading">MLToolBench</text>
  <text x="33" y="91" class="subtitle">Learn to act on evidence</text>

  <path d="M164 190H241" class="stroke" stroke="var(--muted)" marker-end="url(#arrow)"/>
  <path d="M354 190H431" class="stroke" stroke="var(--muted)" marker-end="url(#arrow)"/>
  <circle cx="110" cy="190" r="46" fill="var(--blue-soft)"/>
  <g class="stroke" stroke="var(--blue)">
    <rect x="85" y="163" width="36" height="47" rx="6" fill="var(--surface)"/>
    <path d="M95 175h16M95 184h10"/>
    <circle cx="119" cy="196" r="12" fill="var(--blue-soft)"/>
    <path d="m128 205 11 11"/>
  </g>

  <circle cx="300" cy="190" r="52" fill="var(--teal-soft)"/>
  <g class="stroke" stroke="var(--teal)">
    <rect x="271" y="169" width="58" height="45" rx="14" fill="var(--surface)"/>
    <path d="M300 169v-11M265 183v12M335 183v12M288 202h24"/>
    <circle cx="300" cy="154" r="4" fill="var(--teal)" stroke="none"/>
    <circle cx="288" cy="186" r="4" fill="var(--teal)" stroke="none"/>
    <circle cx="312" cy="186" r="4" fill="var(--teal)" stroke="none"/>
  </g>

  <circle cx="490" cy="190" r="46" fill="var(--violet-soft)"/>
  <g class="stroke" stroke="var(--violet)">
    <rect x="463" y="170" width="54" height="42" rx="7" fill="var(--surface)"/>
    <path d="m474 181 9 9-9 9M491 200h13"/>
  </g>
  <text x="110" y="261" class="label">Tools</text>
  <text x="300" y="261" class="label">Agent</text>
  <text x="490" y="261" class="label">Code</text>
  <path d="M490 275v2q0 16-20 16H130q-20 0-20-16v-2" class="stroke" stroke="var(--muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="214" y="281" width="172" height="25" rx="12" fill="var(--bg)"/>
  <text x="300" y="300" text-anchor="middle" font-size="18" fill="var(--muted)">Verify &amp; iterate</text>
  <path d="M32 317H568" stroke="var(--line)"/>
  <text x="300" y="345" text-anchor="middle" font-size="21" font-weight="600">SFT → RL with SPICE</text>
</svg>
